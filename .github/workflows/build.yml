name: Build And Upload

on:
  push:
    tags:
      - "*"

jobs:
  call-reusable-workflow:
    uses: intisy/workflows/.github/workflows/build.yml@main
    with:
      ref_name: ${{ github.ref_name }}
      java_version: '8'
      jdk_distribution: temurin
      build_task: bootJar --no-daemon
      release_assets: 'build/libs/*-[0-9]*.jar'
      generate_release_notes: true
      pre_test_task: installPlaywright --no-daemon
      test_task: unitTest --no-daemon
      test_runners: '["ubuntu-latest", "windows-latest"]'
    secrets:
      envPAT: ${{ secrets.PAT }}
