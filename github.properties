description=Java Spring Boot REST API that replicates the eBay Kleinanzeigen scraper, using Playwright for headless browser scraping.
example=```|// Start the API (Playwright workers start automatically on port 8080)|// then call the endpoints:|GET http://localhost:8080/inserate?query=laptop&pageCount=1|GET http://localhost:8080/inserat/{adId}|GET http://localhost:8080/inserate-detailed?query=laptop&pageCount=1||Currently supported endpoints:||  * [x] - GET /inserate (search ads with optional filters)  |  * [x] - GET /inserat/{id} (fetch full ad detail)  |  * [x] - GET /inserate-detailed (combined search + detail)  |  * [x] - GET / (API info and status)```
